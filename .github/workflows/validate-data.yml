name: Validate YBS data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r tools/requirements.txt

      - name: Schema + consistency validation
        run: python tools/validate_data.py

      - name: Coord / naming audit
        run: python tools/audit_data.py --fail-on-error
